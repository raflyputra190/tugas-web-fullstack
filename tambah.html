<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Bacaan - My Bookshelf</title>
</head>
<body>
    <header>
        <h1>Tambah Bacaan Baru</h1>
        <p>Catat buku fisik atau artikel Substack favoritmu di sini.</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Beranda (Katalog)</a></li>
            <li><a href="tambah.html">Tambah Bacaan</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Formulir Input Bacaan</h2>
            <form action="index.html" method="GET">
                <div>
                    <label for="tipe">Tipe Bacaan:</label><br>
                    <select id="tipe" name="tipe" required>
                        <option value="">-- Pilih Tipe --</option>
                        <option value="Buku Fisik">Buku Fisik</option>
                        <option value="E-Book">E-Book</option>
                        <option value="Substack">Substack / Artikel Digital</option>
                    </select>
                </div>
                <br>
                <div>
                    <label for="judul">Judul Bacaan / Artikel:</label><br>
                    <input type="text" id="judul" name="judul" placeholder="Contoh: Atomic Habits atau Judul Artikel Substack" required style="width: 300px;">
                </div>
                <br>
                <div>
                    <label for="sumber">Penulis / Nama Newsletter:</label><br>
                    <input type="text" id="sumber" name="sumber" placeholder="Contoh: James Clear / The Pragmatic Engineer" required style="width: 300px;">
                </div>
                <br>
                <div>
                    <label for="url">Link / URL (Khusus Substack / Digital):</label><br>
                    <input type="url" id="url" name="url" placeholder="https://substack.com/..." style="width: 300px;">
                </div>
                <br>
                <div>
                    <label for="kategori">Kategori Topik:</label><br>
                    <input type="text" id="kategori" name="kategori" placeholder="Contoh: Teknologi, Self-Improvement, Bisnis" required style="width: 300px;">
                </div>
                <br>
                <div>
                    <label for="sinopsis">Catatan / Sinopsis Singkat:</label><br>
                    <textarea id="sinopsis" name="sinopsis" rows="4" placeholder="Tulis ringkasan atau poin penting..." style="width: 300px;"></textarea>
                </div>
                <br>
                <button type="submit">Simpan Bacaan</button>
            </form>
        </section>
    </main>

    <footer>
        <p> My Bookshelf </p>
    </footer>
</body>
</html>
