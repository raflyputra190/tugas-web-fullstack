<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Bacaan - My Bookshelf</title>
    <!-- Manggil Bootstrap 5 lewat CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar Responsif -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">📚 My Bookshelf</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="tambah.html">Tambah Data</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Konten Utama dengan Sistem Grid -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <!-- Card untuk Form -->
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white text-center">
                        <h4 class="mb-0">Formulir Input Bacaan</h4>
                    </div>
                    <div class="card-body p-4">
                        <form action="index.html" method="GET">
                            <div class="mb-3">
                                <label for="tipe" class="form-label fw-bold">Tipe Bacaan</label>
                                <select class="form-select" id="tipe" name="tipe" required>
                                    <option value="" selected disabled>-- Pilih Tipe --</option>
                                    <option value="Buku Fisik">Buku Fisik</option>
                                    <option value="E-Book">E-Book</option>
                                    <option value="Substack">Substack Artikel</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="judul" class="form-label fw-bold">Judul Bacaan / Artikel</label>
                                <input type="text" class="form-control" id="judul" name="judul" placeholder="Masukkan judul..." required>
                            </div>

                            <div class="mb-4">
                                <label for="penulis" class="form-label fw-bold">Penulis / Sumber</label>
                                <input type="text" class="form-control" id="penulis" name="penulis" placeholder="Nama penulis atau sumber web..." required>
                            </div>

                            <!-- Tombol Aksi -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="index.html" class="btn btn-secondary">Batal</a>
                                <button type="submit" class="btn btn-primary px-4">Simpan Data</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Wajib Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
